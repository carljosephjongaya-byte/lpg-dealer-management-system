<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Riders</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#0b6b53"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icon-192.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="./css/styles.css" rel="stylesheet"></head><body><div data-layout></div><span data-page-title hidden>Rider Clearance</span><script type="module" src="./js/riders.js"></script><script>
 let installPrompt=null;
 window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  installPrompt=event;
  showInstallButton();
 });
 function showInstallButton(){
  if(document.getElementById('installAppButton'))return;
  const topbar=document.querySelector('.topbar');
  if(!topbar)return;
  const button=document.createElement('button');
  button.id='installAppButton';
  button.className='btn btn-sm btn-primary-lpg ms-2';
  button.innerHTML='<i class="bi bi-download"></i> Download app';
  button.onclick=async()=>{
   if(!installPrompt){
    showInstallHelp();
    return;
   }
   installPrompt.prompt();
   await installPrompt.userChoice;
   installPrompt=null;
   button.remove();
  };
  topbar.querySelector('.topbar-user')?.prepend(button);
 }
  function showInstallHelp(){
   if(document.getElementById('installHelp'))return;
   const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
   const help=document.createElement('div');
   help.id='installHelp';
   help.className='install-help';
   help.innerHTML=ios
    ?'<strong>Download this app</strong><button type="button" aria-label="Close">×</button><p>Tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>'
    :'<strong>Download this app</strong><button type="button" aria-label="Close">×</button><p>Open the browser menu, then choose <b>Add to Home screen</b>.</p>';
   help.querySelector('button').onclick=()=>help.remove();
   document.body.append(help);
  }
 window.addEventListener('load',()=>{
  setTimeout(()=>{
   const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
   if(ios&&!window.navigator.standalone)showInstallButton();
  },500);
 });
 if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
