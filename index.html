<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LPG Dealer - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/styles.css" rel="stylesheet"></head>
<body class="login-body"><main class="login-card" aria-labelledby="loginTitle">
<div class="brand-mark"><i class="bi bi-fuel-pump"></i></div><h1 id="loginTitle" class="h4 fw-bold">LPG Dealer Management</h1><p class="text-secondary mb-4">Inventory, deposits, and rider dispatch</p>
<form id="loginForm"><div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" required autocomplete="username"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" required autocomplete="current-password"></div><div id="loginError" class="alert alert-danger d-none"></div><button class="btn btn-primary-lpg w-100 py-2" type="submit">Sign in</button></form>
<hr><div class="small text-secondary"><strong>Demo accounts</strong><div>Admin: <code>admin / admin123</code></div><div>Cashier: <code>cashier / cash123</code></div><div>Rider: <code>rider1 / rider123</code></div></div>
</main><script type="module">import {login,currentUser} from './js/auth.js';import './js/storage.js';if(currentUser()) location.href='dashboard.html';document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const u=document.getElementById('username').value.trim();const p=document.getElementById('password').value;const user=login(u,p);if(!user){const x=document.getElementById('loginError');x.textContent='Incorrect username or password.';x.classList.remove('d-none')}else location.href='dashboard.html'};</script></body></html>
